<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoE Layouts</title>
<style>
  :root {
    --bg: #0d0f12; --panel: #161a20; --line: #262c35; --text: #e6e3dc; --muted: #8a8f98;
    --accent: #d9a441; --accent-dim: #d9a44133; --ok: #5bbf72; --bad: #d0564b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: baseline; gap: 14px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .act { color: var(--accent); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 13px; }
  h1 { margin: 0; font-size: 22px; font-weight: 650; }
  .meta { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); display: inline-block; align-self: center; }
  .dot.on { background: var(--ok); }
  .hint { padding: 12px 18px 4px; font-size: 22px; font-weight: 650; color: var(--accent); line-height: 1.3; }
  .hint:empty { display: none; }
  .card .tell { display: block; padding: 6px 8px 8px; text-align: left; color: var(--text); font-size: 14px; background: var(--panel); border-radius: 0 0 8px 8px; }
  .crumbs { display: flex; gap: 6px; align-items: center; padding: 10px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .crumbs button { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 3px 10px; cursor: pointer; font: inherit; }
  .crumbs button:hover { border-color: var(--accent); }
  .crumbs .cur { color: var(--accent); font-weight: 650; }
  .crumbs .help { margin-left: auto; color: var(--muted); font-size: 13px; }
  .cards { flex: 1; min-height: 0; min-width: 0; display: grid; gap: 10px; justify-content: center; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-content: start; overflow: auto; }
  .card { position: relative; border: 2px solid var(--line); border-radius: 10px; background: #000; cursor: pointer; padding: 0; color: inherit; }
  .card:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .card img { width: 100%; max-height: var(--cell, 60vh); object-fit: contain; display: block; border-radius: 8px; }
  .card .tag { position: absolute; top: 6px; left: 8px; font-weight: 700; text-shadow: 0 0 4px #000, 0 0 2px #000; }
  .card .start { position: absolute; top: 4px; right: 4px; z-index: 1; width: 36%; max-height: none; border: 1px solid var(--accent); border-radius: 6px; background: #000; }
  .card .tag small { color: var(--muted); font-weight: 500; margin-left: 4px; }
  .leaf { flex: 1; display: flex; justify-content: center; min-height: 0; overflow: auto; }
  .leaf img { max-height: calc(100vh - 170px); max-width: 100%; object-fit: contain; background: #000; border: 1px solid var(--line); border-radius: 8px; }
  main { flex: 1; display: flex; gap: 16px; padding: 16px 18px; min-height: 0; }
  aside { width: 300px; flex: 0 0 auto; display: flex; flex-direction: column; gap: 14px; overflow: auto; }
  aside:empty { display: none; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .box h2 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .box ul { margin: 0; padding-left: 18px; }
  .box li { margin: 3px 0; }
  .hints img { width: 100%; border-radius: 6px; margin-top: 6px; background: #000; }
  .empty { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column;
    color: var(--muted); text-align: center; gap: 6px; }
  .empty b { color: var(--text); font-size: 20px; font-weight: 600; }
  .warn { color: var(--accent); }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; color: var(--muted); }
  .timer { display: flex; align-items: baseline; gap: 12px; font-variant-numeric: tabular-nums; }
  .timer:empty { display: none; }
  .t-total { font-size: 22px; font-weight: 700; }
  .t-sub { color: var(--muted); font-size: 13px; }
  .t-sub b { color: var(--text); font-weight: 600; }
  .timer.paused .t-total { color: var(--muted); }
  .timer button { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 1px 8px; cursor: pointer; font: inherit; font-size: 13px; }
  .timer button:hover { border-color: var(--accent); }
  .splits table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
  .splits td { padding: 2px 0; }
  .splits td.n { text-align: right; padding-left: 8px; }
  .splits tr.cur td { color: var(--accent); }
  .splits .muted { color: var(--muted); }
  .ahead { color: var(--ok); } .behind { color: var(--bad); }
  .map { position: relative; display: block; }
  .leaf .map { display: inline-block; }
  .card .start.l { right: auto; left: 4px; } .card .start.b { top: auto; bottom: 4px; }
  .mk { z-index: 2; position: absolute; transform: translate(-50%, -50%); pointer-events: none; aspect-ratio: 1; }
  .mk .ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--c); box-shadow: 0 0 0 2px #000, 0 0 12px var(--c); }
  .mk .lbl { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 3px; background: var(--c); color: #000;
    font: 800 11px/1.5 system-ui, sans-serif; padding: 0 5px; border-radius: 4px; white-space: nowrap; box-shadow: 0 0 0 1px #000; }
  .mk.below .lbl { bottom: auto; top: 100%; margin: 3px 0 0; }
  .leaf .mk .lbl { font-size: 14px; }
  .trial a { color: var(--accent); }
  .trial { border-color: var(--accent); }
  .legend summary { cursor: pointer; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .legend ul { list-style: none; padding: 0; margin: 8px 0; font-size: 13px; }
  .legend .lg { display: inline-block; min-width: 44px; text-align: center; color: #000; font-weight: 800; font-size: 11px; border-radius: 4px; padding: 0 4px; }
  .legend .dice { background: #3a0f3f; color: #fff; } .legend .yel { background: #3a3a10; color: #ffeb3b; border: 1px solid #ffeb3b; }
  .legend .grn { background: none; color: #3ddc84; }
  .legend button { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 2px 10px; cursor: pointer; font: inherit; font-size: 13px; }
  .labbtn { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 1px 9px; cursor: pointer; font: inherit; font-size: 13px; }
  .labbtn:hover { border-color: var(--accent); color: var(--text); }
  .lab { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; overflow: auto; }
  .labmap { width: 100%; max-height: 52vh; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .labmap .e { stroke: #3b4350; stroke-width: 4; } .labmap .e.hot { stroke: #3ddc84; stroke-width: 6; }
  .labmap circle { fill: #20252d; stroke: #4a525e; stroke-width: 3; }
  .labmap .path circle { stroke: #3ddc84; } .labmap .cur circle { fill: var(--accent); stroke: #fff; }
  .labmap .n { text-anchor: middle; font: 700 14px system-ui; fill: var(--text); } .labmap .cur .n { fill: #000; }
  .labmap .b { text-anchor: middle; font: 800 12px system-ui; }
  .labnext { font-size: 22px; font-weight: 700; color: var(--accent); }
  .labrooms { border-collapse: collapse; font-size: 13px; } .labrooms td { padding: 3px 10px 3px 0; border-bottom: 1px solid var(--line); }
  .labrooms tr.path td:first-child { color: #3ddc84; font-weight: 700; } .labrooms tr.cur td { color: var(--accent); }
  .labrooms .muted, .lab .muted { color: var(--muted); }
  .labimport { background: var(--panel); border: 1px dashed var(--accent); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .lab a { color: var(--accent); }
  @media (max-width: 760px) { main { flex-direction: column; } aside { width: auto; } }
  /* Portrait / half-screen window: info goes under the maps, maps get the full width. */
  @media (max-aspect-ratio: 1/1) {
    main { flex-direction: column; }
    aside { width: auto; flex-direction: row; flex-wrap: wrap; align-items: flex-start; max-height: 34vh; }
    aside .box { flex: 1 1 260px; }
  }
</style>
</head>
<body>
<header>
  <span class="act" id="act"></span>
  <h1 id="name">Waiting for the game…</h1>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <button class="labbtn" id="labbtn" title="Labyrinth map (Lab Compass file from poelab.com)">Lab</button>
  <span class="timer" id="timer"></span>
  <span class="dot" id="dot" title="connection"></span>
</header>
<div class="hint" id="hint"></div>
<nav class="crumbs" id="crumbs"></nav>
<main id="main"></main>
<script>
// Static build only: reads Client.txt in the browser (File System Access API,
// Chrome/Edge) instead of talking to the poe-layouts server. Nothing leaves the
// computer. The timer follows the same rules as src/timer.rs.
(() => {
  "use strict";
  const START = "1_1_1", COAST = "1_1_2", SCAN = 4 << 20, POLL_MS = 1000, KEY = "poe-layouts-timer", IDLE_MS = 5 * 60 * 1000;
  const AREA_RE = /\] Generating level (\d+) area "([^"]+)" with seed (\d+)/;
  const TS_RE = /^(\d{4})\/(\d{2})\/(\d{2}) (\d{2}):(\d{2}):(\d{2}) /;
  const tsOf = (l) => {
    const m = TS_RE.exec(l);
    return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime() : null;
  };

  let zones = {}, onState = null, cur = null, seq = 0, lastPublish = 0, entered = null;
  const ENTERED_RE = /\] : You have entered (.+)\.$/;

  // ---------- timer ----------
  const blank = () => ({ run: null, prev: [], last_event: 0, last_activity: 0 });
  let timer = blank();
  try { timer = JSON.parse(localStorage.getItem(KEY)) || blank(); } catch (_) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(timer)); } catch (_) {} };
  const active = (v, now) => v.ms + (v.since != null ? Math.max(0, now - v.since) : 0);
  const last = () => timer.run && timer.run.visits[timer.run.visits.length - 1];
  function close(at) {
    const v = last();
    if (v && v.since != null) { v.ms += Math.max(0, at - v.since); v.since = null; }
  }
  function actEnds(run, now) {
    const out = []; let cum = 0;
    for (const v of run.visits) {
      cum += active(v, now);
      const e = out[out.length - 1];
      if (e && e.act === v.act) e.end_ms = cum; else out.push({ act: v.act, end_ms: cum });
    }
    return out;
  }
  function startRun(at) {
    close(at);
    const old = timer.run;
    if (old) {
      const ends = actEnds(old, at);
      ends.pop(); // only finished acts are worth comparing against
      if (ends.length) timer.prev = ends;
    }
    timer.run = { started: at, visits: [], paused: false };
  }
  // Silence beyond IDLE_MS since the previous log line (AFK, crash) is not counted.
  function activity(at) {
    const la = timer.last_activity || 0, v = last();
    if (la > 0 && at - la > IDLE_MS && v && v.since != null && v.since <= la) v.since += at - la - IDLE_MS;
    timer.last_activity = Math.max(la, at);
  }
  function gameClosed(at) {
    timer.last_event = Math.max(timer.last_event, at);
    activity(at);
    close(at);
  }
  function enter(at, a) {
    timer.last_event = Math.max(timer.last_event, at);
    activity(at);
    const l = last();
    // New character = fresh Twilight Strand (not walking back from The Coast, not a relog).
    const fresh = !l ? !timer.run && a.campaign
      : a.id === START && l.id !== COAST && !(l.id === START && (a.seed == null || l.seed === a.seed));
    if (fresh) startRun(at);
    close(at);
    const run = timer.run;
    if (!run) return;
    run.paused = false;
    const v = run.visits[run.visits.length - 1];
    if (v && v.id === a.id) { v.since = at; if (a.seed != null) v.seed = a.seed; return; }
    const ca = v ? v.act : 1;
    run.visits.push({ id: a.id, name: a.name, act: a.act != null ? Math.max(a.act, ca) : ca,
      campaign: a.campaign, seed: a.seed, ms: 0, since: at });
  }
  function gameStarted(at, lastSeen) {
    timer.last_event = Math.max(timer.last_event, at);
    const v = last();
    if (v && v.since != null) {
      v.ms += Math.max(0, Math.min(lastSeen != null ? lastSeen : v.since, at) - v.since);
      v.since = null;
    }
    activity(at);
  }
  function view(wall) {
    const run = timer.run;
    if (!run) return null;
    const cutoff = timer.last_activity > 0 ? timer.last_activity + IDLE_MS : null;
    const now = cutoff != null ? Math.min(wall, cutoff) : wall;
    const c = last(), sum = (vs) => vs.reduce((s, v) => s + active(v, now), 0);
    const acts = []; let st = 0;
    for (const e of actEnds(run, now)) {
      const p = timer.prev.find((x) => x.act === e.act);
      acts.push({ act: e.act, ms: e.end_ms - st, end_ms: e.end_ms, prev_end_ms: p ? p.end_ms : null });
      st = e.end_ms;
    }
    return {
      at: wall, running: !!c && c.since != null && (cutoff == null || wall < cutoff),
      idle_in_ms: cutoff != null ? Math.max(0, cutoff - wall) : null, paused: run.paused, started: run.started,
      total_ms: sum(run.visits), zone_ms: c ? active(c, now) : 0,
      zone_total_ms: c ? sum(run.visits.filter((v) => v.id === c.id)) : 0,
      act: c ? c.act : 1, act_ms: acts.length ? acts[acts.length - 1].ms : 0, acts,
      recent: run.visits.slice(0, -1).reverse().slice(0, 12)
        .map((v) => ({ id: v.id, name: v.name, act: v.act, campaign: v.campaign, ms: v.ms })),
    };
  }

  // ---------- zones ----------
  function zoneFor(id) {
    if (zones[id]) return zones[id];
    const kind = id.startsWith("Hideout") ? "hideout" : id.startsWith("MapWorlds") ? "map"
      : id.includes("Labyrinth") ? "labyrinth" : id.endsWith("_town") ? "town" : "other";
    return { id, kind, name: null, act: null, level: null, layouts: [], hints: [], hint: null,
      direction: null, facts: [], notes: [], missing_images: 0 };
  }
  const publish = () => onState && onState({ enabled: true, visible: !!cur, variant: 0, seq: ++seq,
    zone: cur, timer: view(Date.now()), entered });

  // ---------- log ----------
  let handle = null, pos = 0, partial = "", decoder = new TextDecoder(), lastTs = null, first = true, busy = false;

  function handleLines(lines, history) {
    const seen = timer.last_event;
    const isFresh = (at) => !history || at > seen;
    let lastArea = null, events = 0;
    for (const l of lines) {
      const ts = tsOf(l);
      const en = l.includes("] : You have entered ") && ENTERED_RE.exec(l);
      if (en) {
        events++;
        entered = { name: en[1], n: (entered ? entered.n : 0) + 1 };
      } else if (l.includes("] Closing game gracefully")) {
        events++;
        const at = ts != null ? ts : Date.now();
        if (isFresh(at)) gameClosed(at);
      } else if (l.includes("***** LOG FILE OPENING *****")) {
        events++;
        const at = ts != null ? ts : Date.now();
        if (isFresh(at)) gameStarted(at, lastTs);
      } else if (l.includes("Generating level")) {
        const m = AREA_RE.exec(l);
        if (m) {
          events++;
          const at = ts != null ? ts : Date.now(), z = zoneFor(m[2]);
          if (isFresh(at)) enter(at, { id: z.id, name: z.name, act: z.act, campaign: z.kind === "campaign", seed: +m[3] });
          lastArea = z;
          if (!history) cur = z;
        }
      }
      if (ts != null) lastTs = ts;
    }
    if (history && lastArea) cur = lastArea;
    // Plain activity only republishes when it changed something or every 30 s.
    const before = JSON.stringify({ ...timer, last_activity: 0 });
    if (lastTs != null && isFresh(lastTs)) activity(lastTs);
    const changed = events > 0 || before !== JSON.stringify({ ...timer, last_activity: 0 });
    save();
    if (changed || Date.now() - lastPublish >= 30000) { lastPublish = Date.now(); publish(); }
  }

  async function poll() {
    if (!handle || busy) return;
    busy = true;
    try {
      const f = await handle.getFile();
      if (f.size < pos) { pos = 0; partial = ""; decoder = new TextDecoder(); } // game relaunched
      const from = first ? Math.max(0, f.size - SCAN) : pos;
      if (f.size === from && !first) return;
      const text = partial + decoder.decode(await f.slice(from, f.size).arrayBuffer(), { stream: true });
      pos = f.size;
      const lines = text.split("\n");
      partial = lines.pop();
      if (first && from > 0) lines.shift(); // started mid-line
      const history = first;
      first = false;
      handleLines(lines.map((l) => l.replace(/\r$/, "")), history);
      setStatus(`Reading ${f.name}`, true);
    } catch (e) {
      setStatus(`Cannot read the log (${e.message}). Pick it again.`, false);
      showPicker(null);
      handle = null;
    } finally {
      busy = false;
    }
  }

  // ---------- picker UI ----------
  let bar = null;
  function setStatus(text, ok) {
    const dot = document.getElementById("dot");
    if (dot) { dot.classList.toggle("on", ok); dot.title = text; }
    if (ok && bar) { bar.remove(); bar = null; }
  }
  function db() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("poe-layouts", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  }
  async function kv(key, value) {
    try {
      const d = await db();
      return await new Promise((res) => {
        const tx = d.transaction("kv", value === undefined ? "readonly" : "readwrite"), st = tx.objectStore("kv");
        const r = value === undefined ? st.get(key) : st.put(value, key);
        r.onsuccess = () => res(r.result); r.onerror = () => res(undefined);
      });
    } catch (_) { return undefined; }
  }
  function use(h) {
    handle = h; pos = 0; partial = ""; decoder = new TextDecoder(); first = true;
    kv("log", h);
    poll();
  }
  function showPicker(saved) {
    if (bar) bar.remove();
    const btn = (label, fn) => { const b = document.createElement("button"); b.textContent = label; b.onclick = fn; return b; };
    bar = document.createElement("div");
    bar.className = "picker";
    if (!window.showOpenFilePicker) {
      bar.append("This page reads the game log directly and needs Chrome or Edge (Firefox cannot follow a local file).");
    } else {
      const pick = btn("Choose Client.txt", async () => {
        try {
          const [h] = await window.showOpenFilePicker({ types: [{ description: "Path of Exile log", accept: { "text/plain": [".txt"] } }] });
          use(h);
        } catch (_) { /* cancelled */ }
      });
      bar.append(pick);
      if (saved) {
        bar.append(" ", btn(`Continue with ${saved.name}`, async () => {
          if ((await saved.requestPermission({ mode: "read" })) === "granted") use(saved);
        }));
      }
      // Chrome refuses files under "system" folders (Program Files, ~/.local/share), where
      // Steam keeps the game. A hard link in Documents is the same file under a readable path.
      const win = /Windows/i.test(navigator.userAgent);
      const cmd = win
        ? 'mklink /H "%USERPROFILE%\\Documents\\PoE-Client.txt" "C:\\Program Files (x86)\\Steam\\steamapps\\common\\Path of Exile\\logs\\Client.txt"'
        : 'ln ~/.local/share/Steam/steamapps/common/"Path of Exile"/logs/Client.txt ~/Documents/PoE-Client.txt';
      const list = document.createElement("div");
      list.className = "paths";
      const step = (html) => { const d = document.createElement("div"); d.innerHTML = html; list.append(d); return d; };
      step("<b>Game installed via Steam in the default folder?</b> Chrome won't open files there (\u201csystem files\u201d). "
        + "Run this once in " + (win ? "<b>cmd</b> (Win+R \u2192 cmd)" : "a terminal") + " \u2014 it makes a link to the same log in Documents:");
      const row = step(""), code = document.createElement("code");
      code.textContent = cmd;
      const copy = btn("copy", async () => {
        try { await navigator.clipboard.writeText(cmd); copy.textContent = "copied"; } catch (_) { copy.textContent = "select & Ctrl+C"; }
        setTimeout(() => (copy.textContent = "copy"), 1500);
      });
      copy.className = "copy";
      row.append(copy, " ", code);
      step("Then click <b>Choose Client.txt</b> \u2192 Documents \u2192 <b>PoE-Client.txt</b>.");
      const note = document.createElement("div");
      note.className = "muted";
      note.textContent = win
        ? "Standalone client (not Steam)? Use C:\\Program Files (x86)\\Grinding Gear Games\\Path of Exile\\logs\\Client.txt as the second path. "
          + "Game on another drive (e.g. D:\\SteamLibrary)? Pick …\\Path of Exile\\logs\\Client.txt directly; a hard link only works "
          + "on the same drive, so if needed link it to D:\\PoE-Client.txt instead. The log is read locally, never uploaded."
        : "Game in another folder? Pick …/Path of Exile/logs/Client.txt directly; if Chrome refuses, link it the same way "
          + "(a hard link must stay on the same disk). The log is read locally, never uploaded.";
      bar.append(list, note);
    }
    document.body.insertBefore(bar, document.body.firstChild);
  }

  window.PoeEngine = {
    async start(apply) {
      onState = apply;
      const style = document.createElement("style");
      style.textContent = ".picker{padding:12px 18px;background:var(--accent-dim);border-bottom:1px solid var(--accent);font-size:14px}"
        + ".picker button{background:var(--accent);color:#000;border:0;border-radius:6px;padding:5px 12px;font:inherit;font-weight:650;cursor:pointer}"
        + ".picker code{color:var(--text);user-select:all}.picker .paths{margin-top:8px}.picker .paths div{margin-top:4px}"
        + ".picker button.copy{background:none;color:var(--accent);border:1px solid var(--accent);padding:1px 8px;font-weight:500}"
        + ".picker .muted{color:var(--muted);margin-top:6px;font-size:13px}";
      document.head.append(style);
      try { zones = await (await fetch("zones.json")).json(); } catch (e) { setStatus("zones.json failed to load", false); }
      const dot = document.getElementById("dot");

    },
    /** Tests: feed log lines without a file. */
    _feed(lines, history, zoneMap) { if (zoneMap) zones = zoneMap; handleLines(lines, history); return timer; },
    timer(cmd) {

      if (cmd === "pause") { close(now); if (timer.run) timer.run.paused = true; }

<script>

// Layout images form a decision tree per zone: "2" → "2_1" | "2_2" → "2_2_1" | "2_2_2".

function el(tag, attrs = {}, ...kids) {

// Zones with a Trial of Ascendancy (normal Labyrinth). Guide content stays on poelab.com.

// Picks the column count that makes the (square) maps as large as possible in the space left.
function fit() {
  const v = document.querySelector(".cards");
  if (!v || !v.dataset.n) return;
  const n = +v.dataset.n, gap = 10, extra = v.dataset.tells ? 34 : 4;
  v.style.gridTemplateColumns = "1fr";
  const W = v.clientWidth, H = v.clientHeight;
  let best = { c: 1, size: 0 };
  for (let c = 1; c <= n; c++) {
    const rows = Math.ceil(n / c);
    const size = Math.min((W - gap * (c - 1)) / c - 4, (H - gap * (rows - 1)) / rows - extra);
    if (size > best.size) best = { c, size };
  }
  const px = Math.max(160, Math.floor(best.size));
  v.style.gridTemplateColumns = `repeat(${best.c}, ${px + 4}px)`;
  v.style.setProperty("--cell", `${px}px`);
}

// ---- Run timer: server snapshot + local ticking while running ----
let timerAt = 0;
const T = () => state && state.timer;

      el("table", {}, ...recent.map((v) => el("tr", {}, el("td", { class: v.campaign ? "" : "muted" }, v.name || v.id), el("td", { class: "n" }, fmt(v.ms))))));

setInterval(() => { if (T() && T().running) drawTimer(); }, 1000);


// ---- Labyrinth: the user's own Lab Compass file from poelab.com (kept in this browser) ----
let lab = null, labPos = null, labOpen = location.hash === "#lab", lastEnteredN = null;
try { lab = JSON.parse(localStorage.getItem("lab")); labPos = JSON.parse(localStorage.getItem("labpos")); } catch (_) {}
const labSave = () => { try { localStorage.setItem("lab", JSON.stringify(lab)); localStorage.setItem("labpos", JSON.stringify(labPos)); } catch (_) {} };
const OPP = { N: "S", S: "N", E: "W", W: "E", NE: "SW", SW: "NE", NW: "SE", SE: "NW" };
const ARROW = { N: "↑", S: "↓", E: "→", W: "←", NE: "↗", NW: "↖", SE: "↘", SW: "↙" };
const utcToday = () => new Date().toISOString().slice(0, 10);

function labGraph() {
  const adj = {};

  for (const r of lab.rooms) for (const [dir, to] of Object.entries(r.exits || {})) {
    adj[r.id][to] = adj[r.id][to] || dir;
    adj[to] = adj[to] || {};
    adj[to][r.id] = adj[to][r.id] || OPP[dir] || "";
  }

}
// Izaro's last room: the trial room furthest right.
const labGoal = () => lab.rooms.reduce((a, r) => (+r.x > +a.x ? r : a)).id;
// Fewest rooms; on a tie, avoid gauntlets/puzzles (they cost time).
function labPath(from) {
  const adj = labGraph(), goal = labGoal(), byId = Object.fromEntries(lab.rooms.map((r) => [r.id, r]));
  const cost = (id) => 1 + 0.4 * ((byId[id] && byId[id].contents) || []).filter((c) => /gauntlet|puzzle/i.test(c)).length;
  const dist = { [from]: 0 }, prev = { [from]: null }, todo = new Set([from]);

}
function labPicker() {
  const inp = el("input", { type: "file", accept: ".json,application/json" });
  inp.addEventListener("change", async () => { if (inp.files[0]) labImport(await inp.files[0].text()); });
  return el("div", { class: "labimport" },
    el("b", {}, "Labyrinth: load today's Lab Compass file"),
    el("span", {}, " — on poelab.com open today's lab notes (Normal / Cruel / Merciless / Uber), click “Lab Compass file”, then pick or drop the .json here. It stays in this browser."),
    inp);
}
const BADGE = [[/gauntlet/i, "G", "#40c4ff"], [/puzzle/i, "P", "#40c4ff"], [/darkshrine/i, "D", "#ff5252"],
  [/argus/i, "A", "#ffb020"], [/key/i, "K", "#cfd8dc"], [/door/i, "L", "#90a4ae"], [/trove|chest/i, "T", "#ffd740"]];
function labView() {
  const box = el("div", { class: "lab" });
  if (!lab) { box.append(labPicker()); return box; }
  const cur = labPos && labPos.date === lab.date ? labPos.room : null;
  const path = labPath(cur || "1"), onPath = new Set(path), adj = labGraph();
  const xs = lab.rooms.map((r) => +r.x), ys = lab.rooms.map((r) => +r.y);
  const [x0, x1, y0, y1] = [Math.min(...xs) - 40, Math.max(...xs) + 40, Math.min(...ys) - 40, Math.max(...ys) + 52];
  const NS = "http://www.w3.org/2000/svg";
  const sv = (tag, a = {}, text) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); if (text != null) e.textContent = text; return e; };
  const svg = sv("svg", { viewBox: `${x0} ${y0} ${x1 - x0} ${y1 - y0}`, class: "labmap" });
  const byId = Object.fromEntries(lab.rooms.map((r) => [r.id, r]));

    g.append(sv("title", {}, `${r.id}. ${r.name}${r.contents.length ? " — " + r.contents.join(", ") : ""}`));
    g.append(sv("circle", { cx: r.x, cy: r.y, r: 17 }));
    g.append(sv("text", { x: r.x, y: +r.y + 5, class: "n" }, r.id));
    const badges = [];
    for (const c of r.contents) { const b = BADGE.find(([re]) => re.test(c)); badges.push(b ? [b[1], b[2], c] : [c[0].toUpperCase(), "#fff", c]); }
    badges.forEach(([t, color], i) => g.append(sv("text", { x: +r.x + (i - (badges.length - 1) / 2) * 14, y: +r.y + 34, class: "b", fill: color }, t)));
    svg.append(g);
  }
  const stale = lab.date && lab.date !== utcToday();
  const info = el("div", { class: "labinfo" },
    el("b", {}, `${lab.difficulty || "Lab"} · ${lab.date || ""}`),
    stale ? el("span", { class: "warn" }, " — not today's lab, load a fresh file") : "",
    el("div", { class: "t-sub" }, `Izaro: ${[lab.weapon, lab.phase1, lab.phase2].filter(Boolean).join(" · ")}`
      + ([lab.trap1, lab.trap2].some((t) => t && t !== "NoTrap") ? ` · traps: ${[lab.trap1, lab.trap2].filter((t) => t && t !== "NoTrap").join(", ")}` : "")));
  // Next step: the compass direction of the exit to take.
  let next = null;
  if (cur) {
    const i = path.indexOf(cur);
    if (i >= 0 && path[i + 1]) { const to = path[i + 1], dir = adj[cur][to]; next = el("div", { class: "labnext" }, `${ARROW[dir] || ""} ${dir || ""} exit → room ${to} (${byId[to].name})`); }
    else if (i === path.length - 1) next = el("div", { class: "labnext" }, "Izaro's room");
  } else next = el("div", { class: "t-sub" }, "Position: enter the lab (Aspirants' Plaza → first room) and it will follow you.");
  const rows = lab.rooms.map((r) => el("tr", { class: (r.id === cur ? "cur " : "") + (onPath.has(r.id) ? "path" : "") },
    el("td", {}, r.id), el("td", {}, r.name), el("td", {}, r.contents.join(", ")),
    el("td", { class: "muted" }, Object.entries(adj[r.id] || {}).map(([to, d]) => `${ARROW[d] || ""}${to}`).join(" "))));
  box.append(info, next || "", svg,
    el("div", { class: "t-sub" }, `Shortest path: ${path.join(" → ")} (${path.length} rooms). G gauntlet · P puzzle · D darkshrine · A Argus · K key · L locked door · T trove`),
    el("table", { class: "labrooms" }, ...rows),
    el("div", { class: "labbar" }, el("button", { onclick: () => { labOpen = false; render(); } }, "Back to maps"), " ", labPicker().lastChild,
      " ", el("a", { href: "https://www.poelab.com/", target: "_blank", rel: "noopener" }, "poelab.com ↗")));
  return box;
}
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", async (e) => {
  const f = e.dataTransfer && e.dataTransfer.files[0];
  if (f && /\.json$/i.test(f.name)) { e.preventDefault(); labImport(await f.text()); }
});

let viewKey = "";
function apply(s) {
  const id = s.zone ? s.zone.id : null;
  if (id !== zoneId) { path = ""; zoneId = id; }  // every zone change starts at the root
  state = s;
  timerAt = Date.now();
  if (s.entered && s.entered.n !== lastEnteredN) { lastEnteredN = s.entered.n; labTrack(s.entered.name, s.zone); }
  // Timer-only updates must not rebuild the maps.
  const key = JSON.stringify({ ...s, seq: 0, timer: !!s.timer });
  if (key !== viewKey) { viewKey = key; render(); }
  drawTimer();
}

function connect() {
  if (window.PoeEngine) return window.PoeEngine.start(apply); // static build: log read in the browser
  const es = new EventSource("/events");
  es.addEventListener("open", () => $("dot").classList.add("on"));
  es.addEventListener("state", (e) => apply(JSON.parse(e.data)));
  es.addEventListener("error", () => $("dot").classList.remove("on")); // EventSource reconnects itself
}

document.addEventListener("keydown", (e) => {
  const z = state && state.zone;
  if (!z) return;
  const all = nodes(z);
  if (e.key === "Backspace" || e.key === "Escape") { if (path) go(parentOf(path)); }
  else if (e.key === "Home") go("");
  else if (/^[1-9]$/.test(e.key)) {
    const kids = !path && !steps ? all.filter((x) => !childrenOf(all, x.code).length) : childrenOf(all, path);
    const n = kids[+e.key - 1];
    if (n) go(n.code);
  } else return;
  e.preventDefault();
});

$("labbtn").addEventListener("click", () => { labOpen = !labOpen; render(); });
connect();
</script>
</body>
